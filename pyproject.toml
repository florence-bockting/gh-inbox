[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-inbox"
version = "0.1.0"
description = "A local interface for GitHub notifications, built on the gh CLI"
requires-python = ">=3.10"
dependencies = ["textual>=0.60"]

[project.scripts]
gh-inbox = "ghinbox.cli:main"

[tool.setuptools]
packages = ["ghinbox"]

[tool.setuptools.package-data]
ghinbox = ["static/*.html"]
