[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-inbox"
version = "0.3.1"
description = "A local interface for notifications of Codeberg and GitHub"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["flask>=3.1", "textual>=0.60"]

[project.optional-dependencies]
dev = ["pip-audit", "pytest", "ruff==0.17.0"]
docs = ["mkdocs<2", "mkdocs-material>=9.5"]

[project.scripts]
oss-inbox = "ossinbox.cli:main"

[tool.setuptools.packages.find]
include = ["ossinbox*"]

[tool.setuptools.package-data]
"ossinbox.ui" = ["static/*"]
