name: Docs

# Codeberg Pages serves the `pages` branch at
# https://florence-bockting.codeberg.page/oss-inbox/
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: codeberg-small
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[docs]"
      - run: mkdocs build --strict
      # CODEBERG_TOKEN is an access token with write access to the repository.
      - if: github.event_name == 'push'
        run: |
          cd site
          git init -b pages
          git add -A
          git -c user.name=forgejo-actions -c user.email=actions@noreply.codeberg.org \
            commit -m "Deploy docs from $FORGEJO_SHA"
          git push --force "https://oauth2:${TOKEN}@codeberg.org/${FORGEJO_REPOSITORY}.git" pages
        env:
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
