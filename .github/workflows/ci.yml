name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: ruff check ossinbox tests
      - run: pytest -q tests
      - run: pip-audit --skip-editable

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --noconfirm packaging/oss-inbox.spec
      - run: dist/oss-inbox --help
        shell: bash
      - run: dist/oss-inbox sync
        shell: bash
        env:
          OSS_INBOX_DIR: ${{ runner.temp }}/oss-inbox
          GH_TOKEN: ${{ github.token }}
