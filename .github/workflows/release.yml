name: Release

# Two starts:
# - CI passes on a push to main. The workflow releases when no tag exists for the
#   version in pyproject.toml. So a new version number makes a new release.
# - You push a tag such as v0.2.0 by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

jobs:
  version:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: check
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$version" ]; then
              echo "::error::Tag $tag does not match version $version in pyproject.toml"
              exit 1
            fi
            release=true
          else
            tag=v$version
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag exists. No release."
              release=false
            else
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: oss-inbox-linux
          - os: windows-latest
            asset: oss-inbox-win.exe
          - os: macos-latest
            asset: oss-inbox-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: pyinstaller --noconfirm packaging/oss-inbox.spec
      - run: dist/oss-inbox --help
        shell: bash
      - run: mv dist/oss-inbox* "dist/${{ matrix.asset }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Add the files to a release made by hand. Otherwise make a new release and its tag.
      - run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
      # Codeberg is the main repository. Its runners cannot build for Windows or macOS.
      # So this mirror also adds the files to the Codeberg release.
      # CODEBERG_TOKEN is a Codeberg access token with write access to the repository.
      - run: |
          api=https://codeberg.org/api/v1/repos/florence-bockting/oss-inbox
          auth="Authorization: token $CODEBERG_TOKEN"
          id=$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" | jq -r .id) || id=
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG\", \"target_commitish\": \"$SHA\", \"name\": \"$TAG\"}" \
              "$api/releases" | jq -r .id)
          fi
          for f in assets/*; do
            name=$(basename "$f")
            old=$(curl -fsS -H "$auth" "$api/releases/$id/assets" | jq -r ".[] | select(.name == \"$name\") | .id")
            if [ -n "$old" ]; then
              curl -fsS -X DELETE -H "$auth" "$api/releases/$id/assets/$old"
            fi
            curl -fsS -X POST -H "$auth" -F "attachment=@$f" "$api/releases/$id/assets?name=$name" > /dev/null
          done
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
