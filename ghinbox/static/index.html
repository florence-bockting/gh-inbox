<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Inbox</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2228; --muted: #67707b; --line: #e1e4e8;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --warn: #b5541c; --warn-soft: #fbeee5;
    --ok: #237a4b; --ok-soft: #e4f4ea; --chip: #eef0f3; --pr: #7b45c4;
    --mention: #a3367a; --mention-soft: #f9e6f1; --assign: #8a6100; --assign-soft: #fbf1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --panel: #1c2026; --text: #e3e6ea; --muted: #959ea8; --line: #2c323a;
      --accent: #6d9cf0; --accent-soft: #1f2c44; --warn: #f0a070; --warn-soft: #3a2619;
      --ok: #6fcf97; --ok-soft: #1a3326; --chip: #262b33; --pr: #b48cf0;
      --mention: #f08cc8; --mention-soft: #3a1f30; --assign: #e8c060; --assign-soft: #33290f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; }
  .status .bad { color: var(--warn); }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--panel);
        border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { border: 0; background: none; color: var(--muted); padding: 10px 12px;
               font: inherit; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .count { background: var(--chip); border-radius: 10px; padding: 0 7px; margin-left: 4px; font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .grow { flex: 1; }
  button.btn, select, input { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  button.btn { cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 14px;
          padding: 3px 11px; cursor: pointer; font: inherit; color: var(--muted); }
  .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 10px 14px;
         border-top: 1px solid var(--line); align-items: center; }
  .row:first-child { border-top: 0; }
  .row.done { opacity: .55; }
  .title a { color: var(--text); text-decoration: none; font-weight: 500; }
  .title a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
           background: var(--chip); color: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .badge.review_requested { background: var(--accent-soft); color: var(--accent); }
  .badge.mention, .badge.team_mention { background: var(--mention-soft); color: var(--mention); }
  .badge.assign { background: var(--assign-soft); color: var(--assign); }
  .badge.stalled, .badge.reminded { background: var(--warn-soft); color: var(--warn); }
  .badge.activity { background: var(--ok-soft); color: var(--ok); }
  .badge.kind { background: none; border: 1px solid currentColor; font-weight: 600; }
  .badge.kind-pr { color: var(--pr); }
  .badge.kind-issue { color: var(--ok); }
  .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .controls label { color: var(--muted); font-size: 12px; }
  .controls input { width: 64px; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .settings { display: grid; grid-template-columns: max-content 120px 1fr; gap: 10px 14px;
              align-items: center; background: var(--panel); border: 1px solid var(--line);
              border-radius: 8px; padding: 16px; }
  .settings .help { color: var(--muted); font-size: 12px; }
  .settings-note { color: var(--muted); margin: 12px 2px; }
  .settings-note.error { color: var(--warn); }
  .error { color: var(--warn); margin: 8px 0; }
  #banner:empty { display: none; }
  #banner { background: var(--warn-soft); color: var(--warn); padding: 8px 20px;
            border-bottom: 1px solid var(--line); }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr; }
    .controls { justify-content: flex-start; }
    .settings { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>GitHub Inbox</h1>
  <button class="btn primary" id="sync">Sync now</button>
  <label><input type="checkbox" id="showDone"> Show done</label>
  <span class="status" id="status"></span>
</header>
<nav id="tabs"></nav>
<div id="banner"></div>
<main id="main"></main>

<script>
const TABS = [
  ["action", "Action"], ["watch", "Watch"], ["mine", "My work"],
  ["repos", "Repos"], ["settings", "Settings"],
];
const REASONS = {
  review_requested: "review request", mention: "mention", team_mention: "team mention",
  assign: "assigned", new_issue: "new issue", new_pr: "new PR", author: "your item",
  comment: "comment", subscribed: "subscribed", state_change: "state change",
  ci_activity: "CI", manual: "subscribed", security_alert: "security",
};
const KINDS = {pr: "PR", issue: "Issue", other: "Other"};
// Filters per tab: [field, label of the "all" option, label of one value].
const FILTER_FIELDS = {
  action: ["repo", "kind", "reason"], watch: ["repo", "kind"], mine: ["repo", "kind"],
};
const FIELD_LABELS = {
  repo: ["All repos", (v) => v], kind: ["All kinds", (v) => KINDS[v] || v],
  reason: ["All types", (v) => REASONS[v] || v],
};
let tab = location.hash.slice(1) || "action";
let filters = {action: {}, watch: {}, mine: {}};
let hideStalled = false;
let oldest = {action: false, watch: false, mine: false};
let status = {};

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

async function get(path) {
  const r = await fetch(path);
  return r.json();
}
async function post(path, body = {}) {
  const r = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json", "X-GH-Inbox": "1"},
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

function renderTabs() {
  const c = status.counts || {};
  $("#tabs").innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === tab ? "active" : ""}">${label}` +
    (c[id] ? `<span class="count">${c[id]}</span>` : "") + `</button>`).join("");
}

function renderStatus() {
  const parts = [];
  if (status.login) parts.push("@" + esc(status.login));
  parts.push(status.last_sync ? "synced " + ago(status.last_sync) : "never synced");
  parts.push(status.poller_running ? "poller running"
             : `<span class="bad">poller not running</span>`);
  if (status.last_error) parts.push(`<span class="bad" title="${esc(status.last_error)}">sync error</span>`);
  const r = status.rate || {};
  if (r.limit) {
    const api = `API ${r.remaining}/${r.limit}`;
    parts.push(r.level === "ok" ? api : `<span class="bad">${api}</span>`);
  }
  $("#status").innerHTML = parts.join(" · ");
  $("#banner").textContent =
    r.level === "paused" ? `Sync paused: only ${r.remaining} of ${r.limit} GitHub API requests left. ` +
                           `The sync starts again at ${r.reset_clock}. Watch fewer repos, or sync less often.`
    : r.level === "low" ? `Few GitHub API requests left: ${r.remaining} of ${r.limit} until ${r.reset_clock}. ` +
                          `The sync pauses below 10%.` : "";
}

function itemRow(it) {
  const ref = it.number ? `${it.repo}#${it.number}` : it.repo;
  const kind = it.state === "draft" ? "Draft PR" : KINDS[it.kind] || it.kind;
  const badges = [`<span class="badge kind kind-${esc(it.kind)}">${esc(kind)}</span>`];
  if (it.tab !== "mine")
    badges.push(`<span class="badge ${esc(it.reason)}">${esc(REASONS[it.reason] || it.reason)}</span>`);
  if (it.assigned && it.reason !== "assign")
    badges.push(`<span class="badge assign">${REASONS.assign}</span>`);
  if (it.stalled) badges.push(`<span class="badge stalled">stalled</span>`);
  if (it.activity) badges.push(`<span class="badge activity">new activity</span>`);
  if (it.tab === "action" && it.notify_count > 1)
    badges.push(`<span class="badge reminded">reminded ${it.notify_count - 1}×</span>`);
  if (it.state && !["open", "draft"].includes(it.state)) badges.push(`<span class="badge">${esc(it.state)}</span>`);
  const when = it.tab === "mine" ? "updated " + ago(it.updated_at) : ago(it.event_at);
  const key = esc(it.key), cat = esc(it.category);
  // Pop-ups follow the tab that shows the item. Stalled pop-ups need a My work item.
  const ownMine = it.tab === "mine" && it.category === "mine";
  let controls = "";
  if (it.tab === "action" || ownMine) {
    const hours = it.remind_hours ?? "";
    const ph = it.tab === "action" ? status.settings.default_remind_hours : "off";
    controls += `<label>remind every</label><input type="number" min="0" step="any"
      data-remind="${key}" data-cat="${cat}" value="${hours}" placeholder="${ph}"><label>h</label>`;
  }
  if (ownMine) {
    controls += `<label>stalled after</label><input type="number" min="0" step="any"
      data-stall="${key}" value="${it.stall_days ?? ""}" placeholder="${status.settings.stall_days}"><label>d</label>`;
  }
  controls += `<select data-move="${key}" data-cat="${cat}"><option value="">Move to…</option>
    ${TABS.slice(0, 3).filter(([id]) => id !== it.tab)
      .map(([id, label]) => `<option value="${id}">${label}</option>`).join("")}</select>`;
  controls += `<button class="btn" data-done="${key}" data-cat="${cat}" data-val="${it.done ? 0 : 1}">
    ${it.done ? "Undo" : "Done"}</button>`;
  return `<div class="row ${it.done ? "done" : ""}">
    <div><div class="title">${badges.join("")}<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
    <div class="meta">${esc(ref)} · ${it.author ? "by " + esc(it.author) + " · " : ""}${when}</div></div>
    <div class="controls">${controls}</div></div>`;
}

async function renderItems() {
  let items = await get(`/api/items?category=${tab}&done=${$("#showDone").checked ? 1 : 0}` +
                        `&order=${oldest[tab] ? "asc" : "desc"}`);
  let toolbar = "";
  const fields = FILTER_FIELDS[tab] || [];
  const chosen = filters[tab] || {};
  // Offer only the values that occur in the current items. Keep the chosen one listed.
  toolbar = fields.map((field) => {
    const [all, label] = FIELD_LABELS[field];
    const values = [...new Set(items.map((i) => i[field]).filter(Boolean)
      .concat(chosen[field] ? [chosen[field]] : []))].sort();
    return `<select data-ffield="${field}"><option value="">${all}</option>` + values.map((v) =>
      `<option value="${esc(v)}" ${v === chosen[field] ? "selected" : ""}>${esc(label(v))}</option>`).join("") +
      `</select>`;
  }).join("");
  if (tab === "mine")
    toolbar += `<label><input type="checkbox" id="hideStalled" ${hideStalled ? "checked" : ""}> Hide stalled</label>`;
  if (fields.some((f) => chosen[f]) || (tab === "mine" && hideStalled))
    toolbar += `<button class="btn" id="clearFilters">Clear filters</button>`;
  toolbar += `<button class="btn" id="order" title="Reverse the order">${oldest[tab] ? "↑ Oldest first" : "↓ Newest first"}</button>`;
  if (tab === "watch") toolbar += `<span class="grow"></span><button class="btn" id="allDone">Mark all done</button>`;
  items = items.filter((i) => fields.every((f) => !chosen[f] || i[f] === chosen[f])
    && !(tab === "mine" && hideStalled && i.stalled));
  const hint = !status.watched && tab !== "mine"
    ? `<div class="empty">You watch no repos yet. Open the <b>Repos</b> tab and select some.</div>` : "";
  $("#main").innerHTML = `<div class="toolbar">${toolbar}</div>` + (hint ||
    `<div class="list">${items.map(itemRow).join("") || `<div class="empty">Nothing here.</div>`}</div>`);
}

async function renderRepos() {
  const repos = await get("/api/repos");
  $("#main").innerHTML = `<div class="toolbar">
      <input id="newRepo" placeholder="owner/repo" style="width:240px">
      <button class="btn" id="addRepo">Add and watch</button>
      <button class="btn" id="loadRepos">Load my GitHub repos</button>
      <span class="grow"></span><input id="repoFilter" placeholder="Filter" style="width:180px">
    </div><div class="error" id="repoError"></div>
    <div class="list" id="repoList">${repos.map((r) => `<div class="row" data-name="${esc(r.full_name.toLowerCase())}">
      <div><label><input type="checkbox" data-watch="${esc(r.full_name)}" ${r.watched ? "checked" : ""}>
      <b>${esc(r.full_name)}</b></label><div class="meta">${esc(r.source || "")}${r.watch_since ? " · watched since " + ago(r.watch_since) : ""}</div></div>
      <div></div></div>`).join("") || `<div class="empty">No repos yet. Add one, or load your GitHub repos.</div>`}</div>`;
}

function renderSettings() {
  const s = status.settings;
  const limit = (status.rate && status.rate.limit) || 5000;
  const field = (key, label, help) => `<label for="set-${key}">${label}</label>
    <input type="number" min="0" step="any" id="set-${key}" data-setting="${key}" value="${esc(s[key])}">
    <span class="help">${help}</span>`;
  $("#main").innerHTML = `<div class="settings">
    ${field("stall_days", "Stalled after (days)", "Your issue or PR counts as stalled after this many days without activity. Each item can override it. 0 turns it off.")}
    ${field("default_remind_hours", "Remind every (hours)", "Default reminder interval for new action items. Each item can override it. 0 turns reminders off.")}
    ${field("poll_minutes", "Sync every (minutes)", "How often the poller asks GitHub for changes.")}
    ${field("new_item_days", "Watch history (days)", "When you start to watch a repo, show its issues and PRs from this many days back.")}
    ${field("notify", "Pop-ups on (1) or off (0)", "Desktop pop-ups from the poller.")}
  </div><div class="error" id="setError"></div>
  <p class="settings-note ${status.estimate_per_hour > 0.8 * limit ? "error" : ""}">
    API use: at most about <b>${status.estimate_per_hour}</b> requests each hour
    with ${status.watched} watched repos (limit ${limit}).
    ${status.last_sync_cost != null ? `The last sync used ${esc(status.last_sync_cost)}.` : ""}
    Unchanged repos cost nothing, because GitHub does not count an ETag answer "304".
  </p>`;
}

async function render() {
  status = await get("/api/status");
  renderTabs();
  renderStatus();
  if (tab === "repos") return renderRepos();
  if (tab === "settings") return renderSettings();
  return renderItems();
}

document.addEventListener("click", async (e) => {
  const t = e.target;
  if (t.dataset.tab) { tab = t.dataset.tab; location.hash = tab; return render(); }
  if (t.id === "order") { oldest[tab] = !oldest[tab]; return render(); }
  if (t.id === "clearFilters") {
    filters[tab] = {};
    if (tab === "mine") hideStalled = false;
    return render();
  }
  if (t.dataset.done) {
    await post("/api/items/done", {key: t.dataset.done, category: t.dataset.cat, done: t.dataset.val === "1"});
    return render();
  }
  if (t.id === "allDone" && confirm("Mark every Watch item done?")) {
    await post("/api/items/all-done", {category: "watch"}); return render();
  }
  if (t.id === "addRepo") {
    try { await post("/api/repos/add", {full_name: $("#newRepo").value}); render(); }
    catch (err) { $("#repoError").textContent = err.message; }
  }
  if (t.id === "loadRepos") {
    t.disabled = true; t.textContent = "Loading…";
    try { await post("/api/repos/load"); render(); }
    catch (err) { $("#repoError").textContent = err.message; t.disabled = false; }
  }
  if (t.id === "sync") {
    t.disabled = true; t.textContent = "Syncing…";
    try { const r = await post("/api/sync"); if (r.result !== "ok") alert("Sync: " + r.result); }
    finally { t.disabled = false; t.textContent = "Sync now"; render(); }
  }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  try {
    if (t.dataset.watch) await post("/api/repos/watch", {full_name: t.dataset.watch, watched: t.checked});
    else if (t.dataset.remind) await post("/api/items/remind", {key: t.dataset.remind, category: t.dataset.cat, hours: t.value});
    else if (t.dataset.stall) await post("/api/items/stall", {key: t.dataset.stall, days: t.value});
    else if (t.dataset.move) {
      if (!t.value) return;
      await post("/api/items/move", {key: t.dataset.move, category: t.dataset.cat, to: t.value});
    }
    else if (t.dataset.setting) await post("/api/settings", {[t.dataset.setting]: t.value});
    else if (t.id === "showDone") return render();
    else if (t.dataset.ffield) { filters[tab][t.dataset.ffield] = t.value; return render(); }
    else if (t.id === "hideStalled") { hideStalled = t.checked; return render(); }
    else return;
    status = await get("/api/status"); renderTabs();
    if (t.dataset.stall || t.dataset.move) render();
  } catch (err) {
    alert(err.message);
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "repoFilter") return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll("#repoList .row").forEach((r) => {
    r.style.display = r.dataset.name.includes(q) ? "" : "none";
  });
});

render();
// Refresh from the local database every 30 s. This makes no GitHub request.
setInterval(() => { if (!document.querySelector("input:focus, select:focus")) render(); }, 30000);
</script>
</body>
</html>
