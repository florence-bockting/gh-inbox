site_name: GitHub Inbox
site_description: A local inbox for your GitHub notifications, built on the gh CLI
site_url: https://florence-bockting.github.io/gh-inbox/
repo_url: https://github.com/florence-bockting/gh-inbox
repo_name: florence-bockting/gh-inbox
edit_uri: edit/main/docs/
copyright: MIT License

nav:
  - Home: index.md
  - Install: install.md
  - Use the app: usage.md
  - Why gh-inbox?: scenarios.md
  - For developers: developers.md

theme:
  name: material
  font:
    text: Lato
  features:
    - content.code.copy
    - navigation.instant
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# The icons folder has the license of the Lucide icons. MkDocs does not need it.
exclude_docs: |
  icons/LICENSE
